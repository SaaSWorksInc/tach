# Builds the Linux wheels for a fork release and attaches them to it.
#
# `scripts/release_fork.py` builds and attaches the wheel for whatever machine
# it runs on, which is usually macOS. This covers the platforms that machine
# cannot cross-compile for, so a release ends up usable from Linux CI and
# containers as well as a developer laptop.
#
# Triggered by pushing a fork release tag (one carrying a PEP 440 local
# segment, e.g. `v0.35.0+deadcode.1`), or manually against an existing tag.
name: fork release (linux wheels)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build and attach wheels for
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    # Upstream publishes to PyPI from `publish.yml`; this workflow exists for
    # forks, and only for versions carrying a local segment.
    if: github.repository != 'tach-org/tach' && contains(inputs.tag || github.ref_name, '+')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
            manylinux: auto
          - target: aarch64
            manylinux: auto
          - target: x86_64
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --find-interpreter

      - name: Attach wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The release may not exist yet: pushing the tag starts this workflow,
          # and release_fork.py creates the release moments later. Create it if
          # we get there first — whichever side loses the race just uploads.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "$TAG"
          gh release upload "$TAG" dist/*.whl --clobber
